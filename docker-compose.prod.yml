name: smart-workplace-prod

# 운영 스택 정의. 로컬에서 `docker compose -f docker-compose.prod.yml build` 로 빌드 검증 가능.
# 실제 운영 기동은 ~/prod/smart-workplace/docker-compose.yml(image-only 복사본)에서 수행한다.
# 이미지 빌드·푸시는 scripts/deploy.sh(buildx multiplatform) 가 담당한다.

services:
  db:
    # DHI 하드닝 postgres 18 + pgvector(#527) — db/Dockerfile 에서 소스 빌드.
    # nonroot(uid 70), PGDATA=/var/lib/postgresql/18/data. nonroot 볼륨 소유권 함정을
    # 피하려 named 볼륨을 쓴다(Docker 가 uid 70 시딩).
    # ⚠️ pg16→pg18 은 메이저 업그레이드 — 첫 배포 전 기존 데이터 dump/restore 선행 필수(별도 ops).
    # multi-arch(amd64/arm64) 로 빌드·푸시: BUILD_ONLY=1 ./scripts/deploy.sh db
    image: ghcr.io/bluleo78/smart-workplace/postgres:latest
    build:
      context: ./db
      dockerfile: Dockerfile
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-workplace}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - prod-db-data:/var/lib/postgresql/18/data
    networks:
      - workplace-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-workplace}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    image: ghcr.io/bluleo78/smart-workplace/api:latest
    build:
      context: ./apps/workplace-api
    environment:
      SPRING_PROFILES_ACTIVE: prod
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-workplace}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY:?ENCRYPTION_MASTER_KEY is required}
      WORKPLACE_AI_AGENT_TOKEN: ${WORKPLACE_AI_AGENT_TOKEN:?WORKPLACE_AI_AGENT_TOKEN is required}
      WORKPLACE_AI_AGENT_URL: http://ai-agent:7070
      WORKPLACE_WORKER_URL: http://worker:7080
      # worker 콜백 인증에 사용하는 내부 서비스 토큰(ai-agent 와 동일 값).
      INTERNAL_SERVICE_TOKEN: ${WORKPLACE_AI_AGENT_TOKEN}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      # 파일 저장 루트 — worker 가 마운트하는 동일 공유 디렉터리로 고정.
      WORKPLACE_STORAGE_ROOT_DIR: /data/storage-data
    volumes:
      # 업로드 파일 저장 루트(host bind — 백업·점검 용이). ⚠️ distroless api 는 nonroot(uid 65532)로
      # 실행되므로 배포 시 호스트 ./storage-data 를 uid 65532 소유로 준비해야 쓰기 가능.
      - ./storage-data:/data/storage-data
    depends_on:
      db:
        condition: service_healthy
    networks:
      - workplace-net
    # healthcheck 제거: DHI distroless 런타임엔 curl/shell 이 없다. 의존 서비스는 plain depends_on 사용.
    restart: unless-stopped

  ai-agent:
    image: ghcr.io/bluleo78/smart-workplace/ai-agent:latest
    build:
      context: .
      dockerfile: apps/workplace-ai-agent/Dockerfile
    volumes:
      # claude OAuth 토큰 캐시·세션. 토큰 자체는 매 호출 시 workplace-api DB 에서 fetch(캐시는 비필수).
      # ⚠️ DHI node 런타임은 nonroot(node, uid 1000)·HOME=/home/node → 마운트 경로도 /home/node/.claude.
      # ⚠️ bind mount 는 이미지에 구운 ~/.claude 스켈레톤을 '가린다'(named volume 과 달리 시딩 안 됨).
      #    배포 시 호스트 ./ai-agent-data 를 uid 1000 소유로 준비해야 쓰기 가능. 캐시가 불필요하면 이 마운트 제거.
      - ./ai-agent-data:/home/node/.claude
    environment:
      PORT: "7070"
      # api 의 WORKPLACE_AI_AGENT_TOKEN 과 동일 값이어야 내부 인증 통과.
      INTERNAL_SERVICE_TOKEN: ${WORKPLACE_AI_AGENT_TOKEN}
      WORKPLACE_API_BASE_URL: http://api:9090/api/v1
    depends_on:
      - api   # api 는 healthcheck 없음(distroless) → plain depends_on
    networks:
      - workplace-net
    # healthcheck 제거: DHI distroless 런타임엔 wget/shell 이 없다.
    restart: unless-stopped

  worker:
    image: ghcr.io/bluleo78/smart-workplace/worker:latest
    build:
      context: ./apps/workplace-worker
    environment:
      # api 파일 저장 루트와 동일 bind mount 경로. api 의 WORKPLACE_STORAGE_ROOT_DIR 과 일치해야 한다.
      WORKER_BLOB_BASE: /data/storage-data
      # 콜백 대상 /internal/worker/** 는 루트 경로(컨텍스트패스/api/v1 없음). ai-agent 와 달리 /api/v1 붙이면 404.
      WORKPLACE_API_BASE_URL: http://api:9090
      # api 의 WORKPLACE_AI_AGENT_TOKEN 과 동일 시크릿을 재사용(내부 서비스 공통 토큰).
      INTERNAL_SERVICE_TOKEN: ${WORKPLACE_AI_AGENT_TOKEN:?WORKPLACE_AI_AGENT_TOKEN is required}
    volumes:
      - ./storage-data:/data/storage-data:ro
    depends_on:
      - api   # api 는 healthcheck 없음(distroless) → plain depends_on
    networks:
      - workplace-net
    # healthcheck 제거: DHI distroless 런타임엔 curl/shell 이 없다.
    restart: unless-stopped

  mcp:
    image: ghcr.io/bluleo78/smart-workplace/mcp:latest
    build:
      context: .
      dockerfile: apps/workplace-mcp/Dockerfile
    environment:
      PORT: "7090"
      WORKPLACE_API_BASE_URL: http://api:9090/api/v1
    ports:
      - "10002:7090"   # 외부 MCP 클라이언트 공개 (web 10000 / admin 10001 다음)
    depends_on:
      - api   # api 는 healthcheck 없음(distroless) → plain depends_on
    networks:
      - workplace-net
    # healthcheck 제거: DHI distroless 런타임엔 wget/shell 이 없다.
    restart: unless-stopped

  web:
    image: ghcr.io/bluleo78/smart-workplace/web:latest
    build:
      context: .
      dockerfile: apps/workplace-web/Dockerfile
      args:
        # mcp 서비스의 호스트 공개 포트(10002)를 기본값으로 사용 — 미설정 시 현행(localhost:7090)과
        # 다른 무해한 폴백(운영 도메인 기준 실제 접근 가능한 포트).
        VITE_MCP_URL: ${VITE_MCP_URL:-http://localhost:10002}
    ports:
      - "${WEB_PORT:-10000}:8080"   # DHI nginx 는 nonroot → 컨테이너 8080 리슨
    depends_on:
      - api   # api 는 healthcheck 없음(distroless) → plain depends_on
    networks:
      - workplace-net
    restart: unless-stopped

  admin:
    image: ghcr.io/bluleo78/smart-workplace/admin:latest
    build:
      context: .
      dockerfile: apps/workplace-admin/Dockerfile
    ports:
      - "${ADMIN_PORT:-10001}:8080"   # DHI nginx 는 nonroot → 컨테이너 8080 리슨
    depends_on:
      - api   # api 는 healthcheck 없음(distroless) → plain depends_on
    networks:
      - workplace-net
    restart: unless-stopped

networks:
  workplace-net:
    driver: bridge

# DHI postgres(nonroot uid 70) 데이터 — named 볼륨(소유권 시딩).
volumes:
  prod-db-data:
