[project]
name = "workplace-converter"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "pymupdf>=1.24",
]
[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "python-pptx>=1.0",
    "python-docx>=1.1",
    "openpyxl>=3.1",
]

[tool.pytest.ini_options]
markers = [
  "engine: 실제 rhwp/soffice 가 필요한 엔진 테스트(컨테이너 test 타깃에서만 실행)",
]
