<!doctype html>
<!--

  Teams 는 이미지를 썸네일 칸(약 1.26:1)에 가운데 기준으로 잘라 채워 가로 x 202~998 만 남긴다. 그래서 로고 타일·이름·소개를
  가운데로 모아 x 약 265~935 안에 둔다(좌우 약 60px 여유). 카카오톡·Slack 은 전체를 보여 주므로 가로 배치를 그대로 쓴다.
  글꼴은 렌더하는 컴퓨터의 시스템 글꼴(macOS 의 Apple SD Gothic Neo — 시안과 같다)이다 — 다시 찍을 때는 macOS 에서 찍는다.
-->

    <style>
      html,

        margin: 0;
        width: 1200px;

        background: #4338ca;
        display: flex;

        justify-content: center;
        gap: 32px;
        font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
      }

        box-sizing: border-box;
        width: 200px;
        height: 200px;
        border-radius: 46px;
        border: 5px solid rgba(255, 255, 255, 0.28);

        display: flex;
        align-items: center;
        justify-content: center;
      }
      .name {
        color: #fff;
        font-size: 78px;
        font-weight: 600;
        line-height: 1;
        letter-spacing: -0.5px;
      }
      .tagline {
        margin-top: 10px;
        color: #c7d2fe;
        font-size: 27px;
        font-weight: 400;
      }
    </style>
  </head>
