<!doctype html>
<html>
<head>
  <title>팀별 일정표</title>
  <style>
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #e2e8f0; padding: 6px 10px; }
    th { background: #f1f5f9; }
  </style>
</head>
<body>
  <h1>팀별 일정표</h1>
  <p>11월 주요 일정입니다.</p>
  <table>
    <thead>
      <tr><th>팀</th><th>담당</th><th>마감</th></tr>
    </thead>
    <tbody>
      <tr><td>플랫폼</td><td>김하나</td><td>11/10</td></tr>
      <tr><td>모바일</td><td>이두리</td><td>11/17</td></tr>
      <tr><td>디자인</td><td><a href="https://example.com/d">박세나</a></td><td>11/24</td></tr>
    </tbody>
  </table>
  <h2>메모</h2>
  <ol>
    <li>마감은 금요일 기준</li>
    <li>변경 시 채널에 공유</li>
  </ol>
</body>
</html>
