# 노트 공유 링크 화면(WP-579) — 검색엔진 비노출. robots.txt 의 Disallow 로 막으면 크롤러가 페이지를 받지 않아 noindex 를 보지 못하고 주소만
# 색인될 수 있어, 응답 헤더 X-Robots-Tag 로 알린다. 이 파일은 conf.d 로 http 블록 안에 들어가므로 map 을 server 밖에 둔다.
# SPA fallback 은 try_files 의 내부 이동(/index.html)이라 location 으로 갈라 붙이면 헤더가 빠진다 — 원래 요청 주소($request_uri)로 값을 정하고,
# 실제로 index.html 을 내보내는 location / 에서 붙인다. 빈 값이면 nginx 가 헤더를 보내지 않는다.
map $request_uri $wiki_share_robots_tag {
    ~^/wiki/share/ "noindex, nofollow";
    default        "";
}

server {
    # DHI nginx 는 nonroot(uid 65532)로 실행되어 <1024 포트를 바인드할 수 없다 → 8080.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 첨부/드라이브 업로드 허용 — API 요청 한도(max-request-size 275MB)를 수용한다.
    client_max_body_size 300m;

    # Gzip 압축
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 256;
    gzip_vary on;

    # Vite 해시 에셋 — 장기 캐시
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";

        # pdf.js 워커(.mjs) — 베이스 이미지 mime.types 에 mjs 가 없어 application/octet-stream 으로 나가면
        # 브라우저가 모듈 워커를 거부해 모든 PDF 미리보기가 실패한다(WP-277). 이 블록에서만 타입 맵을 비우고 JS 로 고정한다.
        # 중첩 location 이라 위의 expires·Cache-Control 을 그대로 물려받는다(이 블록엔 add_header 를 두지 않는다 — 두면 상속이 끊긴다).
        location ~* \.mjs$ {
            types { }
            default_type text/javascript;
        }
    }

    # 서비스워커·manifest 는 항상 재검증 — 캐시되면 새 배포가 반영되지 않는다(업데이트 토스트 불발).
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        default_type application/manifest+json;
        try_files $uri =404;
    }

    # Claude Code 플러그인 마켓플레이스 목록(WP-378) — 없는 파일을 SPA index.html(200)로 돌려주지 않게 정확 일치·404.
    location = /claude/marketplace.json {
        default_type application/json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # 배포 버전 식별(WP-436·439) — 모니터링·롤아웃 확인이 항상 최신 값을 읽도록 재검증시킨다. 없는 파일을 SPA index.html(200)로 돌려주지 않게 정확 일치·404.
    location = /version.json {
        default_type application/json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # API 리버스 프록시 — /api/ 접두를 유지한 채 workplace-api 로 전달
    location /api/ {
        proxy_pass http://api:9090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 스트리밍 지원 (chat/messaging/AI compose)
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
        proxy_read_timeout 86400s;
        add_header X-Accel-Buffering "no";
    }

    # SPA fallback. 공유 링크 화면(/wiki/share/…)만 X-Robots-Tag(위 map) — 다른 주소는 빈 값이라 헤더가 없다.
    # 이 블록엔 다른 add_header 가 없어 상속 끊김 걱정이 없다(server 블록엔 add_header 가 없다).
    location / {
        add_header X-Robots-Tag $wiki_share_robots_tag always;
        try_files $uri $uri/ /index.html;
    }
}
