server {
    # DHI nginx 는 nonroot(uid 65532)로 실행되어 <1024 포트를 바인드할 수 없다 → 8080.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 첨부/드라이브 업로드 허용 — API 요청 한도(max-request-size 275MB)를 수용한다.
    client_max_body_size 300m;

    # Gzip 압축
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 256;
    gzip_vary on;

    # Vite 해시 에셋 — 장기 캐시
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API 리버스 프록시 — /api/ 접두를 유지한 채 workplace-api 로 전달
    location /api/ {
        proxy_pass http://api:9090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 스트리밍 지원 (chat/messaging/AI compose)
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
        proxy_read_timeout 86400s;
        add_header X-Accel-Buffering "no";
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
