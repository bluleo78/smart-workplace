# 노트 공유 링크 화면(WP-579) — 검색엔진 비노출. robots.txt 의 Disallow 로 막으면 크롤러가 페이지를 받지 않아 noindex 를 보지 못하고 주소만
# 색인될 수 있어, 응답 헤더 X-Robots-Tag 로 알린다. 이 파일은 conf.d 로 http 블록 안에 들어가므로 map 을 server 밖에 둔다.
# SPA fallback 은 try_files 의 내부 이동(/index.html)이라 location 으로 갈라 붙이면 헤더가 빠진다 — 원래 요청 주소($request_uri)로 값을 정하고,
# 실제로 index.html 을 내보내는 location / 에서 붙인다. 빈 값이면 nginx 가 헤더를 보내지 않는다.
map $request_uri $wiki_share_robots_tag {
    ~^/wiki/share/ "noindex, nofollow";
    default        "";
}

# workplace-api — /api/ 프록시와 공유 링크 미리보기 하위 요청(WP-895)이 함께 쓴다. 미리보기 쪽 proxy_pass 는 주소에 변수가 들어가
# 이름을 런타임에 찾는데, upstream 으로 이름을 정해 두면 resolver 없이 설정 시점에 정해진다.
upstream workplace_api {
    server api:9090;
}

server {
    # DHI nginx 는 nonroot(uid 65532)로 실행되어 <1024 포트를 바인드할 수 없다 → 8080.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 첨부/드라이브 업로드 허용 — API 요청 한도(max-request-size 275MB)를 수용한다.
    client_max_body_size 300m;

    # Gzip 압축
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 256;
    gzip_vary on;

    # Vite 해시 에셋 — 장기 캐시
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";

        # pdf.js 워커(.mjs) — 베이스 이미지 mime.types 에 mjs 가 없어 application/octet-stream 으로 나가면
        # 브라우저가 모듈 워커를 거부해 모든 PDF 미리보기가 실패한다(WP-277). 이 블록에서만 타입 맵을 비우고 JS 로 고정한다.
        # 중첩 location 이라 위의 expires·Cache-Control 을 그대로 물려받는다(이 블록엔 add_header 를 두지 않는다 — 두면 상속이 끊긴다).
        location ~* \.mjs$ {
            types { }
            default_type text/javascript;
        }
    }

    # 서비스워커·manifest 는 항상 재검증 — 캐시되면 새 배포가 반영되지 않는다(업데이트 토스트 불발).
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        default_type application/manifest+json;
        try_files $uri =404;
    }

    # Claude Code 플러그인 마켓플레이스 목록(WP-378) — 없는 파일을 SPA index.html(200)로 돌려주지 않게 정확 일치·404.
    location = /claude/marketplace.json {
        default_type application/json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # 배포 버전 식별(WP-436·439) — 모니터링·롤아웃 확인이 항상 최신 값을 읽도록 재검증시킨다. 없는 파일을 SPA index.html(200)로 돌려주지 않게 정확 일치·404.
    location = /version.json {
        default_type application/json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # API 리버스 프록시 — /api/ 접두를 유지한 채 workplace-api 로 전달
    location /api/ {
        proxy_pass http://workplace_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 스트리밍 지원 (chat/messaging/AI compose)
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
        proxy_read_timeout 86400s;
        add_header X-Accel-Buffering "no";
    }

    # 공개 노트 공유 링크 미리보기(WP-895) — 메신저 봇은 자바스크립트를 실행하지 않으므로 HTML 을 내려보낼 때 그 노트의 제목·앞부분을 넣는다.
    # 이 주소에서만 SSI 를 켜 index.html 의 공통 메타 block 대신 API 메타 조각을 끼운다(사람·봇이 같은 HTML — 화면은 그대로 SPA).
    # API 가 빈 응답(204, 열 수 없는 링크)이거나 실패·지연되면 SSI stub 으로 공통 메타가 나간다.
    # 값: 공유 링크 HTML 마다 API 호출이 한 번 늘고(아래 짧은 제한 시간), 응답이 노트마다 달라 Last-Modified 가 없어 304 재검증이 없다 — 이 주소만이다.
    # 헤더는 location / 와 같게 붙인다(add_header·sub_filter 는 location 사이에 상속되지 않는다).
    location ~ ^/wiki/share/(?<wiki_share_token>[A-Za-z0-9_-]+)(?:/pages/(?<wiki_share_page>[0-9]+))?/?$ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-cache";
        ssi on;
        sub_filter '__PUBLIC_HOST__' '$host';
        sub_filter_once off;
        try_files /index.html =404;
    }

    # 위 SSI 가 부르는 내부 하위 요청 — 바깥에서 직접 부를 수 없다(internal). 하위 요청은 원래 요청의 변수(토큰·페이지)를 그대로 본다.
    # 방문자의 요청 헤더(쿠키·인증·Accept·Range 등)는 넘기지 않는다 — 공개 엔드포인트라 필요 없고, 봇의 Accept 에 따라 거절되지 않게
    # text/html 만 받는다고 알린다. 압축도 끈다(조각을 HTML 에 그대로 끼운다). 늦어도 페이지가 막히지 않게 짧게 기다린다.
    location = /__wiki-share-meta {
        internal;
        proxy_pass http://workplace_api/api/v1/public/wiki/shares/$wiki_share_token/preview-meta?pageId=$wiki_share_page;
        proxy_pass_request_headers off;
        proxy_pass_request_body off;
        proxy_set_header Host $host;
        proxy_set_header Accept "text/html";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 1s;
        proxy_read_timeout 2s;
    }

    # SPA fallback. 공유 링크 화면(/wiki/share/…)만 X-Robots-Tag(위 map) — 다른 주소는 빈 값이라 헤더가 없다.
    # index.html 은 항상 재검증(no-cache) — 헤더가 없으면 브라우저가 옛 index.html 을 휴리스틱 캐시해, 서비스워커를 거치지 않는
    # 공유 링크(sw.ts NAVIGATION_DENYLIST)도 배포 뒤 옛 앱(새 화면 라우트 없음)으로 열려 404 가 날 수 있다(WP-867).
    # server 블록엔 add_header 가 없어 상속 끊김 걱정이 없다.
    location / {
        add_header X-Robots-Tag $wiki_share_robots_tag always;
        add_header Cache-Control "no-cache";
        # 링크 미리보기 이미지 주소(WP-894) — index.html 의 https://__PUBLIC_HOST__/… 의 호스트를 요청 호스트로 채운다. 같은 이미지가 여러
        # 호스트(운영·데모)로 배포되므로 빌드가 아니라 응답 때 정한다. sub_filter 는 text/html 응답(index.html)에만 걸린다.
        sub_filter '__PUBLIC_HOST__' '$host';
        sub_filter_once off;
        # 바꾼 응답에서도 Last-Modified(약한 ETag)를 남긴다 — 없으면 no-cache 재검증이 304 대신 매번 본문을 다시 받는다.
        # 바뀌는 값은 요청 호스트뿐이고 브라우저 캐시는 호스트별이라 안전하다.
        sub_filter_last_modified on;
        try_files $uri $uri/ /index.html;
    }
}
