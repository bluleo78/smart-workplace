# 로컬 개발 프로파일
spring:
  datasource:
    # 런타임 트래픽은 비특권 app_tenant 롤로 흐른다(RLS 적용 = fail-closed).
    url: jdbc:postgresql://localhost:5434/workplace
    username: app_tenant
    password: app_tenant
    hikari:
      # app_tenant 롤/권한은 V44 마이그레이션(app 권한)이 만든다. 풀이 시작 즉시 접속을 시도하면
      # 마이그레이션 전이라 실패할 수 있으므로 시작 접속 시도를 끄고 첫 쿼리 시 지연 접속한다.
      initialization-fail-timeout: -1
  flyway:
    # 마이그레이션은 테이블/롤 생성·GRANT 가 필요하므로 소유자 권한 롤(app)로 실행한다.
    url: jdbc:postgresql://localhost:5434/workplace
    user: app
    password: app

management:
  endpoint:
    health:
      show-details: always

app:
  cors:
    # 로컬 개발 서버 오리진 (workplace-web: 6173, workplace-admin 운영자 콘솔: 6174)
    # 6174 누락 시 브라우저가 보내는 Origin 을 Spring CORS 가 거부 → "Invalid CORS request" 403
    # (curl 은 Origin 헤더가 없어 통과하므로 증상이 브라우저에서만 발현).
    allowed-origins:
      - http://localhost:6173
      - http://127.0.0.1:6173
      - http://localhost:6174
      - http://127.0.0.1:6174
  jwt:
    # 로컬 개발 전용 키 (Base64). 프로덕션 절대 사용 금지.
    secret: ${JWT_SECRET:d29ya3BsYWNlLWxvY2FsLWRldi1qd3Qtc2VjcmV0LWtleS1ub3QtZm9yLXByb2R1Y3Rpb24tdXNlLW9ubHk=}
  encryption:
    # 로컬 개발 전용 키 — 정확히 32바이트 (AES-256). 프로덕션 절대 사용 금지.
    master-key: ${ENCRYPTION_MASTER_KEY:bG9jYWwtZGV2LWVuY3J5cHRpb24ta2V5LTMyYnkhISE=}

workplace:
  ai-agent:
    # 로컬 개발 전용 기본값. workplace-ai-agent/.env.local의 INTERNAL_SERVICE_TOKEN과 동일 값.
    # 프로덕션에서는 환경변수 WORKPLACE_AI_AGENT_TOKEN 으로 반드시 교체.
    internal-token: ${WORKPLACE_AI_AGENT_TOKEN:changeme-local}
  worker:
    # 워커 콜백 인증 토큰. 로컬 기본값을 ai-agent 와 동일하게 둬야 워커→api 콜백이 통과한다
    # (없으면 빈 토큰 → fail-closed 로 모든 콜백 401 → 추출이 EXTRACTING 에서 정체). 프로덕션은 env 주입.
    internal-token: ${INTERNAL_SERVICE_TOKEN:${WORKPLACE_AI_AGENT_TOKEN:changeme-local}}
    enabled: true
    base-url: http://localhost:7080
    embed:
      model: bge-m3
      dimensions: 1024
      max-chars: 8000
  mail:
    m365:
      # 스파이크에서 확인된 Azure AD 앱 등록 ID — iacloud.kr 테넌트. client-secret 은 환경변수로만 주입.
      client-id: ${M365_CLIENT_ID:aa9c80a9-1234-0000-0000-placeholder000}
      tenant-id: ${M365_TENANT_ID:122340c0-1234-0000-0000-placeholder000}
      client-secret: ${M365_CLIENT_SECRET:}
