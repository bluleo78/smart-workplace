# 「Gen:iA Code」 템플릿(WP-1296) — Works 가 작업 공간에서 사내 Gen:iA Code(genia)를 띄워 개발·테스트·PR 까지 맡긴다.
# 이미지는 apps/workplace-agent-genia-code 를 릴리스가 빌드한 것이고, {appVersion} 은 API 가 자기 릴리스 버전으로 채운다.
# genia 프로그램은 이미지에 없다 — Pod 가 뜰 때 사내 배포 서버(genia-code-server.iacloud.kr)에서 받는다(그 위치에서 닿아야 한다).
# AI 계정은 Gen:iA 로그인 정보(requires genia → provider genia). plugins 는 두지 않는다 — genia-works 는 이미지에 굳힌 genia 확장을, 개발 절차 플러그인(superpowers 등)은
# 빌드 때 Claude 이미지와 같은 plugins.lock 으로 굳힌 것을 genia 가 그대로 읽는다(WP-1336). Pod 가 뜰 때 받는 것은 없다.
name: genia-code
version: "1"
kind: WORKSPACE
card:
  title: Gen:iA Code
  description: 사내 Gen:iA 모델로 작업 공간에서 개발·테스트하고 PR 을 올립니다
  skills: [개발, 테스트, PR]
image: docker.io/iacloudops/genia-works-agent-genia-code:{appVersion}
requires: [genia, repo]
config:
  # 모델 id — genia 설정의 defaultModel 로 들어간다(공급자는 배포본이 genia 로 고정). 목록은 Gen:iA 서버 모델 목록(11-03) 기준.
  # claude-code 와 달리 optionsFrom(account-models)을 달지 않고 정적 목록을 둔다(WP-1405) — Gen:iA 로그인 정보로 모델을 나열하는 서버 API 가
  # 확인되지 않았고, 서버가 갱신 토큰을 쓰면 Pod 안 genia 의 로그인을 끊을 위험이 있으며, 모델 목록 API 는 로그인 계정에 빈 목록을 준다.
  # 목록을 바꿀 때는 Gen:iA 서버 모델 목록을 보고 여기를 손으로 고친다. 나열 API 가 생기면 후속 이슈로 optionsFrom 을 단다(웹은 바꿀 것 없음).
  - key: model
    label: 모델
    type: select
    options:
      - { value: minimax-m2.7, label: MiniMax M2.7 }
      - { value: gpt-6-luna, label: GPT 6 Luna }
      - { value: mimo-v2.6-flash, label: MiMo V2.6 Flash }
      - { value: qwen3.8-27b-fp8, label: Qwen3.8 27B }
    default: qwen3.8-27b-fp8
    required: true
  - key: queue
    label: 대기열 라벨
    type: text
    default: AI 개발팀
    required: false
# requests·limits 근거는 claude-code.yaml 주석과 같다 — 바꿀 때 두 템플릿을 함께 바꾼다.
resources:
  cpuRequest: "2"
  memoryRequest: 4Gi
  cpuLimit: "8"
  memoryLimit: 16Gi
  workDisk: 50Gi
sidecars:
  - name: dind
    image: docker:27-dind
    privileged: true
