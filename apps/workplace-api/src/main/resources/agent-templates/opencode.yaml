# 「OpenCode」 템플릿(WP-1410) — Works 가 작업 공간에서 OpenCode CLI 를 OpenAI 호환 모델 서버(연결해 둔 AI 계정)로 띄워 개발·테스트·PR 까지 맡긴다.
# 이미지는 apps/workplace-agent-opencode 를 릴리스가 빌드한 것이고, {appVersion} 은 API 가 자기 릴리스 버전으로 채운다.
# AI 계정은 OpenAI 호환 연결(requires opencode → provider opencode). 연결 정보(baseURL·apiKey·모델 목록)는 로그인 정보와 같은 경로(login 비밀값 →
# /run/genia/login-info)로 Pod 에 들어가고, 서버가 「연결에 지정한 모델」(defaultModel)을 함께 싣는다. plugins 는 두지 않는다 — genia-works
# (opencode 구동기)와 개발 절차 플러그인(superpowers 등 — Claude 이미지와 같은 plugins.lock 의 스킬)은 빌드 때 굳힌다.
name: opencode
version: "1"
kind: WORKSPACE
card:
  title: OpenCode
  description: OpenAI 호환 모델 서버로 OpenCode 가 작업 공간에서 개발·테스트하고 PR 을 올립니다
  skills: [개발, 테스트, PR]
image: docker.io/iacloudops/genia-works-agent-opencode:{appVersion}
requires: [opencode, repo]
config:
  # 모델 — auto 면 「연결에 지정한 모델」(login-info 의 defaultModel)을 쓴다. 화면은 칸을 열면 서버의 실시간 모델 목록(optionsFrom,
  # 값은 providerId/modelId)에서 고르게 한다 — 목록을 못 불러오면(연결 전·조회 실패) 이 기본 선택지만 보인다.
  - key: model
    label: 모델
    type: select
    optionsFrom: account-models
    options:
      - { value: auto, label: 연결에 지정한 모델 }
    default: auto
    required: true
  - key: queue
    label: 대기열 라벨
    type: text
    default: AI 개발팀
    required: false
# requests·limits 근거는 claude-code.yaml 주석과 같다 — 바꿀 때 네 템플릿을 함께 바꾼다.
resources:
  cpuRequest: "2"
  memoryRequest: 4Gi
  cpuLimit: "8"
  memoryLimit: 16Gi
  workDisk: 50Gi
sidecars:
  - name: dind
    image: docker:27-dind
    privileged: true
