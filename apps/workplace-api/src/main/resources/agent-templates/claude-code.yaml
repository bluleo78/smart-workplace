# 「Claude Code」 템플릿 — Works 가 작업 공간에서 Claude Code 를 띄워 개발·테스트·PR 까지 맡긴다.
# 이미지는 apps/workplace-agent-claude-code 를 릴리스가 빌드한 것이고, {appVersion} 은 API 가 자기 릴리스 버전으로 채운다.
name: claude-code
version: "1"
kind: WORKSPACE
card:
  title: Claude Code
  description: 작업 공간에서 개발·테스트하고 PR 을 올립니다
  skills: [개발, 테스트, PR]
image: docker.io/iacloudops/genia-works-agent-claude-code:{appVersion}
requires: [claude, repo]
config:
  # 모델 — settings.json 의 model 로 들어간다. 화면은 선택지를 그 AI 에 연결된 Claude 계정의 모델 목록에서 채운다(optionsFrom, WP-1405).
  # options 는 별칭 두 개 — 늘 그 계열의 최신을 가리키고, 목록 맨 앞에 보이며, 목록을 받지 못할 때(계정 미연결·조회 실패) 기본 선택지가 된다.
  # 저장 검증은 선택지 대신 모델 id 꼴만 본다(목록에서 고른 전체 id 도 저장된다).
  - key: model
    label: 모델
    type: select
    optionsFrom: account-models
    options:
      - { value: opus, label: Opus(최신) }
      - { value: sonnet, label: Sonnet(최신) }
    default: opus
    required: true
  - key: queue
    label: 대기열 라벨
    type: text
    default: AI 개발팀
    required: false
# requests 는 평소 사용량 기준(쉴 때 1GiB 안팎) — 노드 자리 계산은 이 값으로 한다. limits 는 test:full 실측 최대치(agent anon 약 7GiB,
# 캐시·/dev/shm 포함 약 13GiB, PoC 11-03 측정)를 두고 16Gi 를 유지한다 — 넘으면 OOMKill 이라 넉넉히 둔다.
resources:
  cpuRequest: "2"
  memoryRequest: 4Gi
  cpuLimit: "8"
  memoryLimit: 16Gi
  workDisk: 50Gi
sidecars:
  - name: dind
    image: docker:27-dind
    privileged: true
# 플러그인 버전은 이미지에 굳힌 값(apps/workplace-agent-claude-code/plugins.lock — 11-04 빌드 실측)과 같다.
# genia-works 는 Pod 가 뜰 때 Works 서버의 버전으로 갱신하고, superpowers 는 만든 사람의 마켓플레이스에서 빌드 때 최신을 받으므로 latest 로 둔다(WP-1336).
plugins:
  - { marketplace: genia-works, name: genia-works, version: latest }
  - { marketplace: superpowers-marketplace, name: superpowers, version: latest }
  - { marketplace: anthropic-plugin-directory, name: code-review-anthropics, version: 1.0.1-a2e251d9b97b }
  - { marketplace: anthropic-plugin-directory, name: code-simplifier, version: 1.0.0-ea0a38e1d671 }
  - { marketplace: anthropic-plugin-directory, name: feature-dev, version: 1.0.1-a2e251d9b97b }
  - { marketplace: anthropic-plugin-directory, name: frontend-design, version: 1.1.1-a2e251d9b97b }
  - { marketplace: claude-plugins-official, name: jdtls-lsp, version: 1.0.0 }
  - { marketplace: claude-plugins-official, name: typescript-lsp, version: 1.0.0 }
