# 「Claude Code」 템플릿 — Works 가 작업 공간(컨테이너)에서 Claude Code 를 띄워 개발·테스트·PR 까지 맡긴다.
name: claude-code
version: "1"
kind: WORKSPACE
card:
  title: Claude Code
  description: 작업 공간에서 개발·테스트하고 PR 을 올립니다
  skills: [개발, 테스트, PR]
image: ghcr.io/bluleo78/agent-claude-code:1
requires: [claude, github]
config:
  - key: model
    label: 모델
    type: select
    options:
      - { value: opus, label: Opus }
      - { value: sonnet, label: Sonnet }
    default: opus
    required: true
  - key: queue
    label: 대기열 라벨
    type: text
    default: AI 개발팀
    required: false
resources:
  cpuRequest: "4"
  memoryRequest: 8Gi
  cpuLimit: "8"
  memoryLimit: 16Gi
  workDisk: 50Gi
sidecars:
  - name: dind
    image: docker:27-dind
    privileged: true
# 플러그인 version 은 latest 로 둔다 — WP-1252 에서 DH-VM 의 현재 값으로 고정한다.
plugins:
  - { marketplace: genia-works, name: genia-works, version: latest }
  - { marketplace: anthropic-plugin-directory, name: superpowers, version: latest }
  - { marketplace: anthropic-plugin-directory, name: code-review-anthropics, version: latest }
  - { marketplace: anthropic-plugin-directory, name: code-simplifier, version: latest }
  - { marketplace: anthropic-plugin-directory, name: feature-dev, version: latest }
  - { marketplace: anthropic-plugin-directory, name: frontend-design, version: latest }
  - { marketplace: claude-plugins-official, name: jdtls-lsp, version: latest }
  - { marketplace: claude-plugins-official, name: typescript-lsp, version: latest }
