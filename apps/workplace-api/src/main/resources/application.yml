drive:
  trash:
    retention-days: 30

spring:
  application:
    name: workplace-api
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
  jooq:
    sql-dialect: postgres
  servlet:
    multipart:
      # 이슈 첨부 25MB × 최대 10개. 단일 파일 25MB, 요청 전체 275MB.
      max-file-size: 25MB
      max-request-size: 275MB

# 이슈 첨부 전용 설정 (file 모듈의 firehub.file.* 와는 별도 키 — 우회 흐름).
workplace:
  drive:
    default-quota-bytes: 10737418240  # 10 GB
  attachment:
    upload-dir: ./uploads/attachments
    max-file-size-bytes: 26214400      # 25MB
    max-per-issue: 10
  messaging:
    attachment:
      upload-dir: ./uploads/messaging-attachments
      max-file-size-bytes: 26214400   # 25MB
      max-per-message: 10
      temp-expiry-hours: 24
  ai-agent:
    base-url: ${WORKPLACE_AI_AGENT_URL:http://localhost:7070}
    internal-token: ${WORKPLACE_AI_AGENT_TOKEN}  # 기본값 없음 — 미설정 시 앱 기동 실패 (보안)
    enabled: ${WORKPLACE_AI_AGENT_ENABLED:true}

app:
  jwt:
    secret: ${JWT_SECRET}
    access-expiration: 1800000        # 30분
    refresh-expiration: 604800000     # 7일
  encryption:
    master-key: ${ENCRYPTION_MASTER_KEY}

server:
  port: 9090

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
