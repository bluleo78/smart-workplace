drive:
  trash:
    retention-days: 30

spring:
  application:
    name: workplace-api
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
  jooq:
    sql-dialect: postgres
  # @Scheduled 작업 공용 스레드 수(기본 1). 1이면 메일 선제 분석처럼 LLM 을 순차 호출하는 긴 작업이 메일 동기화·리마인더·정리 잡을
  # 수 분씩 밀어낸다(WP-211). 같은 작업이 겹쳐 돌지는 않는다 — 고정 지연·고정 주기는 앞 회차가 끝나야 다음 회차를 잡고, 파드 간은 ShedLock 이 막는다.
  task:
    scheduling:
      pool:
        size: 4
      thread-name-prefix: sched-
  servlet:
    multipart:
      # 이슈 첨부 25MB × 최대 10개. 단일 파일 25MB, 요청 전체 275MB.
      max-file-size: 25MB
      max-request-size: 275MB

# 파일 저장·첨부 통합 설정 (workplace.storage.* 단일 네임스페이스 — 모든 도메인 공유).
workplace:
  storage:
    root-dir: ${WORKPLACE_STORAGE_ROOT_DIR:./storage-data}
    max-files-per-request: 3
    expiry-hours: 24
    attachment:
      max-file-size-bytes: 26214400   # 25MB
      max-per-issue: 10
      max-per-message: 10
      temp-expiry-hours: 24
    # 노트(wiki) 본문 이미지 첨부. 프리픽스가 attachment.* 가 아니라 wiki.* 다(@Value 와 맞춰야 함).
    wiki:
      max-image-size-bytes: 10485760  # 10MB
      max-per-page: 50                # 해소 가능한 상한 — 본문에서 지우고 저장하면 풀린다(#757)
      max-mappings-per-page: 500      # 매핑 총개수 하드 실링 — 강등 유예 창 안의 폭주 차단(#759)
      demote-grace-hours: 168         # 참조가 빠진 첨부의 유예(7일). 이 안에 참조가 돌아오면 원상 복구(#759)
    # 이슈 본문 이미지(WP-199). 기존 이슈 첨부(attachment.*)와 별개 — 10개 한도에 세지 않는다.
    issue-image:
      max-file-size-bytes: 10485760   # 10MB
      max-pending-per-user: 50        # 사용자·프로젝트별 저장 전 임시 이미지 상한(남용 방지)
      demote-grace-hours: 168         # 본문에서 빠진 이미지 유예(7일) — 안에 다시 넣으면 원상 복구
    mail:
      ttl-days: 7
      max-cache-bytes: 26214400   # 25MB — 이보다 큰 첨부는 캐시 안 함(on-demand)
  auth:
    sso:
      m365:
        # WP-48 로그인 전용 멀티테넌트 Entra 앱. client-id 가 비면 SSO 전체 비활성. secret 은 env 로만 주입.
        client-id: ${SSO_M365_CLIENT_ID:}
        client-secret: ${SSO_M365_CLIENT_SECRET:}
        # 웹 오리진 경유(vite /api 프록시·운영 리버스 프록시) — callback 의 상대경로 302 가 웹으로 가도록.
        redirect-uri: ${SSO_M365_REDIRECT_URI:http://localhost:6173/api/v1/auth/sso/callback}
        authority-base-url: ${SSO_M365_AUTHORITY:https://login.microsoftonline.com}
  mail:
    m365:
      # M365 Graph OAuth2 설정 — client-secret 은 반드시 환경변수로만 주입(평문 커밋 금지)
      client-id: ${M365_CLIENT_ID:}
      tenant-id: ${M365_TENANT_ID:}
      client-secret: ${M365_CLIENT_SECRET:}
      # 프론트 콜백 라우트(팝업 착지). ⚠️ Azure 앱 등록 시 이 URI 를 "Web" 플랫폼으로 추가해야 함
      # — "SPA" 로 등록하면 server-side client_secret 교환이 거부됨(AADSTS9002327).
      redirect-uri: ${M365_REDIRECT_URI:http://localhost:6173/oauth/m365/callback}
  drive:
    default-quota-bytes: 10737418240  # 10 GB
  # Web Push — 폐쇄망(푸시 서비스로 외부 연결 불가)이면 enabled=false. VAPID 키는 env 우선, 없으면 DB 자동 생성.
  push:
    enabled: ${WORKPLACE_PUSH_ENABLED:true}
    preview: ${WORKPLACE_PUSH_PREVIEW:true}          # false 면 알림에 본문 대신 고정 문구
    subject: ${WORKPLACE_PUSH_SUBJECT:}  # VAPID 연락처 — 운영은 mailto:<실제 메일> 필수(Apple 은 localhost 거부, WP-152). 비우면 PushProperties 기본값
    timeout: ${WORKPLACE_PUSH_TIMEOUT:5s}
    vapid-public-key: ${WORKPLACE_PUSH_VAPID_PUBLIC:}
    vapid-private-key: ${WORKPLACE_PUSH_VAPID_PRIVATE:}
  ai-agent:
    base-url: ${WORKPLACE_AI_AGENT_URL:http://localhost:7070}
    internal-token: ${WORKPLACE_AI_AGENT_TOKEN}  # 기본값 없음 — 미설정 시 앱 기동 실패 (보안)
    enabled: ${WORKPLACE_AI_AGENT_ENABLED:true}
  # WP-232: 메인 AI 채팅이 ai-agent 로 넘기는 "누적 요약 + 원문 이력" 근사 토큰 하드 상한.
  # 75% 초과 시 턴 종료 후 비동기 요약(원문 50%까지 압축), 100% 초과 시 그 턴에서 동기 요약.
  home:
    chat:
      context-token-budget: ${WORKPLACE_HOME_CHAT_CONTEXT_TOKEN_BUDGET:128000}
      max-concurrent-per-user: ${WORKPLACE_HOME_CHAT_MAX_CONCURRENT_PER_USER:3}
  # WP-286 노트 동기화 서버(workplace-collab). 내부 토큰은 worker 와 같은 단일 내부 토큰을 공유한다.
  collab:
    base-url: ${WORKPLACE_COLLAB_URL:http://localhost:6095}
    internal-token: ${INTERNAL_SERVICE_TOKEN:${WORKPLACE_AI_AGENT_TOKEN:}}
    enabled: ${WORKPLACE_COLLAB_ENABLED:true}
  worker:
    base-url: ${WORKPLACE_WORKER_URL:http://localhost:7080}
    internal-token: ${INTERNAL_SERVICE_TOKEN:${WORKPLACE_AI_AGENT_TOKEN:}}  # 단일 내부 토큰 — ai-agent 와 동일
    enabled: ${WORKPLACE_WORKER_ENABLED:true}
    embed:
      # 임베딩 모델(설정 가능). 차원은 마이그레이션 vector(1024) 와 일치해야 한다.
      model: ${WORKER_EMBED_MODEL:BAAI/bge-m3}
      dimensions: ${WORKER_EMBED_DIMENSIONS:1024}
      max-chars: ${WORKER_EMBED_MAX_CHARS:8000}
      # 임베딩 게이트(기본 true). false 면 시맨틱 검색 비활성·키워드 전용. 보류된 테넌트별 공급자 설계의 seam.
      enabled: ${WORKER_EMBED_ENABLED:true}
    extract:
      # 백필 스케줄러 한 틱당 재개(findResumable) 최대 파일 수(#735). V124 재개방 백필이 다수 행을 한 번에
      # PENDING 으로 되돌려도, 이 상한이 한 틱 전량 디스패치를 막는다.
      resume-batch-size: ${WORKER_EXTRACT_RESUME_BATCH_SIZE:50}

app:
  jwt:
    secret: ${JWT_SECRET}
    access-expiration: 1800000        # 30분
    refresh-expiration: 604800000     # 7일
    refresh-grace-period-seconds: 5   # 크로스탭 경쟁 완화 유예 기간
  encryption:
    master-key: ${ENCRYPTION_MASTER_KEY}
server:
  port: 9090

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
