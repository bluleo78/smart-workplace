spring:
  application:
    name: workplace-api
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
  jooq:
    sql-dialect: postgres

app:
  jwt:
    secret: ${JWT_SECRET}
    access-expiration: 1800000        # 30분
    refresh-expiration: 604800000     # 7일

server:
  port: 8090

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
