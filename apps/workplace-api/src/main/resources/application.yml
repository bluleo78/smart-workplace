drive:
  trash:
    retention-days: 30

spring:
  application:
    name: workplace-api
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
  jooq:
    sql-dialect: postgres
  servlet:
    multipart:
      # 이슈 첨부 25MB × 최대 10개. 단일 파일 25MB, 요청 전체 275MB.
      max-file-size: 25MB
      max-request-size: 275MB

# 파일 저장·첨부 통합 설정 (workplace.storage.* 단일 네임스페이스 — 모든 도메인 공유).
workplace:
  storage:
    root-dir: ${WORKPLACE_STORAGE_ROOT_DIR:./file-data}
    max-files-per-request: 3
    expiry-hours: 24
    attachment:
      max-file-size-bytes: 26214400   # 25MB
      max-per-issue: 10
      max-per-message: 10
      temp-expiry-hours: 24
    mail:
      ttl-days: 7
      max-cache-bytes: 26214400   # 25MB — 이보다 큰 첨부는 캐시 안 함(on-demand)
  mail:
    m365:
      # M365 Graph OAuth2 설정 — client-secret 은 반드시 환경변수로만 주입(평문 커밋 금지)
      client-id: ${M365_CLIENT_ID:}
      tenant-id: ${M365_TENANT_ID:}
      client-secret: ${M365_CLIENT_SECRET:}
      # 프론트 콜백 라우트(팝업 착지). ⚠️ Azure 앱 등록 시 이 URI 를 "Web" 플랫폼으로 추가해야 함
      # — "SPA" 로 등록하면 server-side client_secret 교환이 거부됨(AADSTS9002327).
      redirect-uri: ${M365_REDIRECT_URI:http://localhost:6173/oauth/m365/callback}
  drive:
    default-quota-bytes: 10737418240  # 10 GB
  ai-agent:
    base-url: ${WORKPLACE_AI_AGENT_URL:http://localhost:7070}
    internal-token: ${WORKPLACE_AI_AGENT_TOKEN}  # 기본값 없음 — 미설정 시 앱 기동 실패 (보안)
    enabled: ${WORKPLACE_AI_AGENT_ENABLED:true}
  worker:
    base-url: ${WORKPLACE_WORKER_URL:http://localhost:7080}
    internal-token: ${INTERNAL_SERVICE_TOKEN:${WORKPLACE_AI_AGENT_TOKEN:}}  # 단일 내부 토큰 — ai-agent 와 동일
    enabled: ${WORKPLACE_WORKER_ENABLED:true}
    embed:
      # 임베딩 모델(설정 가능). 차원은 마이그레이션 vector(1024) 와 일치해야 한다.
      model: ${WORKER_EMBED_MODEL:BAAI/bge-m3}
      dimensions: ${WORKER_EMBED_DIMENSIONS:1024}
      max-chars: ${WORKER_EMBED_MAX_CHARS:8000}

app:
  jwt:
    secret: ${JWT_SECRET}
    access-expiration: 1800000        # 30분
    refresh-expiration: 604800000     # 7일
  encryption:
    master-key: ${ENCRYPTION_MASTER_KEY}
server:
  port: 9090

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
