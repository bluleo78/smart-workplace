# WP-684: 요청 검증 기본 문구(한국어). 제약에 message 를 쓰지 않으면 이 문구가 쓰인다.
# Hibernate Validator 기본 영문(「size must be between 1 and 4000」)이 웹 토스트에 그대로 나오던 것을 막는다.
# 로케일별 파일(_en, _ko)을 두지 않는다 — 요청 로케일이나 서버 기본 로케일이 영어여도 이 기본 파일이 먼저 쓰인다.
# 화면에 그대로 보이는 문구라 정규식·내부 값은 넣지 않는다. 더 구체적인 안내가 필요하면 제약에 한국어 message 를 직접 쓴다.
jakarta.validation.constraints.AssertFalse.message=조건을 만족하지 않습니다
jakarta.validation.constraints.AssertTrue.message=조건을 만족하지 않습니다
jakarta.validation.constraints.DecimalMax.message={value} 이하여야 합니다
jakarta.validation.constraints.DecimalMin.message={value} 이상이어야 합니다
jakarta.validation.constraints.Digits.message=숫자 자릿수가 너무 깁니다(정수 {integer}자리, 소수 {fraction}자리까지)
jakarta.validation.constraints.Email.message=올바른 이메일 주소가 아닙니다
jakarta.validation.constraints.Future.message=미래 시각이어야 합니다
jakarta.validation.constraints.FutureOrPresent.message=현재 또는 미래 시각이어야 합니다
jakarta.validation.constraints.Max.message={value} 이하여야 합니다
jakarta.validation.constraints.Min.message={value} 이상이어야 합니다
jakarta.validation.constraints.Negative.message=0보다 작아야 합니다
jakarta.validation.constraints.NegativeOrZero.message=0 이하여야 합니다
jakarta.validation.constraints.NotBlank.message=값을 입력해 주세요
jakarta.validation.constraints.NotEmpty.message=값을 입력해 주세요
jakarta.validation.constraints.NotNull.message=값이 필요합니다
jakarta.validation.constraints.Null.message=값을 비워 두어야 합니다
jakarta.validation.constraints.Past.message=과거 시각이어야 합니다
jakarta.validation.constraints.PastOrPresent.message=현재 또는 과거 시각이어야 합니다
jakarta.validation.constraints.Pattern.message=형식이 올바르지 않습니다
jakarta.validation.constraints.Positive.message=0보다 커야 합니다
jakarta.validation.constraints.PositiveOrZero.message=0 이상이어야 합니다
# 하한이 0 이면 상한만, 상한이 없으면(Integer.MAX_VALUE) 하한만 말한다.
jakarta.validation.constraints.Size.message=${min == 0 ? '최대 ' += max += '까지 입력할 수 있습니다' : (max == 2147483647 ? '최소 ' += min += ' 이상 입력해야 합니다' : min += '~' += max += ' 사이로 입력해 주세요')}
org.hibernate.validator.constraints.Length.message={min}~{max} 사이로 입력해 주세요
org.hibernate.validator.constraints.Range.message={min}~{max} 사이여야 합니다
org.hibernate.validator.constraints.URL.message=올바른 URL 이 아닙니다
org.hibernate.validator.constraints.UniqueElements.message=같은 값이 여러 번 들어 있습니다
