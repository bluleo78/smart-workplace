<script>
var cur = 0; var slides = document.querySelectorAll('.slide');
function show(i) { slides[cur].classList.remove('active'); cur = (i + slides.length) % slides.length; slides[cur].classList.add('active'); }
document.addEventListener('keydown', function (e) { if (e.key === 'ArrowRight') show(cur + 1); if (e.key === 'ArrowLeft') show(cur - 1); });
function openModal(id) { document.getElementById(id).style.display = 'block'; }
function closeModal(id) { document.getElementById(id).style.display = 'none'; }
