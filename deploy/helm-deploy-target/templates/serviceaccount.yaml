{{- if .Values.serviceAccount.create }}
# 배포 담당 AI 가 쓸 ServiceAccount — AI Pod 가 뜨는 네임스페이스에 둔다.
# agent-runner 의 허용 표(agent.serviceAccounts)에 든 AI 의 Pod 만 이 계정으로 뜬다(WP-2135).
# 토큰 Secret 은 만들지 않는다 — runner 가 Pod 의 agent 컨테이너에만 1시간짜리 투영 토큰을 꽂는다.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "deployTarget.saName" . }}
  namespace: {{ .Values.serviceAccount.namespace }}
  labels:
    {{- include "deployTarget.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
