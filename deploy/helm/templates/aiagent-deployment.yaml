apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-agent
  labels:
    {{- include "swp.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.appReplicas }}
  # 과거 ReplicaSet 보관 개수 — rollout restart 반복 시 0-replica RS 누적 방지
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  # 무중단 롤링(WP-167). 예전 Recreate 는 RWO PVC 단일 점유 때문이었으나, 그 PVC 는 앱 HOME(/home/node)과 다른 경로
  # (/home/appuser/.claude)에 마운트돼 실제로 쓰이지 않았다(비어 있음) → 마운트를 빼고 롤링으로 전환.
  {{- include "swp.rollingStrategy" . | nindent 2 }}
  selector:
    matchLabels:
      app: ai-agent
  template:
    metadata:
      labels:
        app: ai-agent
        app.kubernetes.io/part-of: smart-workplace
      # 환경 변수(MODEL_URL_ALLOWED_HOSTS·NODE_EXTRA_CA_CERTS)는 프로세스 시작 때만 읽힌다 — 이 둘이 바뀌면 다시 띄운다.
      # ConfigMap 전체가 아니라 ai-agent 가 읽는 값만 해시한다(무관한 설정 변경으로 진행 중 채팅·에이전트 실행을 끊지 않게).
      annotations:
        checksum/config: {{ list (.Values.config.modelUrlAllowedHosts | default "") (.Values.aiAgent.extraCaCerts | default "") | toJson | sha256sum }}
    spec:
      {{- include "swp.imagePullSecrets" . | nindent 6 }}
      # preStop 10s + 앱 종료 대기(SHUTDOWN_DRAIN_MS 기본 330s — 진행 중 채팅·에이전트 실행 완료 대기) + 여유
      terminationGracePeriodSeconds: {{ .Values.rollout.aiAgentTerminationGracePeriodSeconds }}
      {{- if .Values.aiAgent.extraCaCerts }}
      volumes:
        - name: extra-ca
          configMap:
            name: ai-agent-extra-ca
      {{- end }}
      containers:
        - name: ai-agent
          image: {{ include "swp.image" (dict "root" $ "id" "ai-agent") | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - containerPort: 7070
              name: http
          env:
            - name: PORT
              value: "7070"
            - name: WORKPLACE_API_BASE_URL
              value: http://api:9090/api/v1
            - name: INTERNAL_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: WORKPLACE_AI_AGENT_TOKEN
            # 모델 서버 주소 내부망 차단 예외(WP-596) — api 와 같은 값
            - name: MODEL_URL_ALLOWED_HOSTS
              valueFrom:
                configMapKeyRef:
                  name: smart-workplace-config
                  key: MODEL_URL_ALLOWED_HOSTS
            # 반복 AI 작업 회차 상한(WP-1407) — 대화형(WORKPLACE_AI_TIMEOUT_MS 5분)과 따로. api 의 결과 대기와 함께 맞춘다. int64: 큰 정수가 1.8e+06 으로 렌더되지 않게
            - name: WORKPLACE_AI_RECURRING_TIMEOUT_MS
              value: {{ .Values.aiAgent.recurringTimeoutMs | int64 | quote }}
            - name: WORKPLACE_AI_RECURRING_MAX_TURNS
              value: {{ .Values.aiAgent.recurringMaxTurns | int64 | quote }}
            {{- if .Values.aiAgent.extraCaCerts }}
            # 사설 CA 를 쓰는 사내 모델 서버용 추가 신뢰 CA — 기본 CA 목록에 덧붙인다(검증은 끄지 않는다)
            - name: NODE_EXTRA_CA_CERTS
              value: /etc/ssl/extra-ca/ca.crt
          volumeMounts:
            - name: extra-ca
              mountPath: /etc/ssl/extra-ca
              readOnly: true
          {{- end }}
          {{- include "swp.preStop" . | nindent 10 }}
          readinessProbe:
            httpGet:
              path: /health
              port: 7070
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 7070
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            {{- toYaml .Values.aiAgent.resources | nindent 12 }}
