apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    {{- include "swp.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.appReplicas }}
  # 과거 ReplicaSet 보관 개수 — rollout restart 반복 시 0-replica RS 누적 방지
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  {{- include "swp.rollingStrategy" . | nindent 2 }}
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
        app.kubernetes.io/part-of: smart-workplace
      annotations:
        # ConfigMap(envFrom)은 파드 시작 때만 읽힌다 — 설정이 바뀌면 다시 띄운다(이미지가 그대로인 릴리스·설정만 바꾼 반영 포함)
        # extraCaCerts(CA)가 바뀌어도 다시 뜬다 — 기동 때 한 번 읽는 파일이라
        checksum/config: {{ list (include (print $.Template.BasePath "/configmap.yaml") .) (.Values.aiAgent.extraCaCerts | default "") | toJson | sha256sum }}
    spec:
      {{- include "swp.imagePullSecrets" . | nindent 6 }}
      terminationGracePeriodSeconds: {{ .Values.rollout.apiTerminationGracePeriodSeconds }}
      initContainers:
        # api 컨테이너는 nonroot(uid 65532)로 실행되나 NFS 저장 볼륨이
        # root:root 소유라 쓰기가 막힘 → root로 마운트 소유권을 맞춰줌.
        - name: fix-storage-perms
          image: {{ .Values.api.initImage | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          securityContext:
            runAsUser: 0
          command:
            - sh
            - -c
            - chown -R 65532:65532 /data/storage-data
          volumeMounts:
            - name: storage
              mountPath: /data/storage-data
      containers:
        - name: api
          image: {{ include "swp.image" (dict "root" $ "id" "api") | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          {{- include "swp.preStop" . | nindent 10 }}
          ports:
            - containerPort: 9090
              name: http
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            {{- with .Values.agentImages }}
            # 실행 템플릿이 쓸 작업 공간 이미지(저장소@sha256:…) — values.yaml agentImages 참고
            - name: AGENT_RUNTIME_IMAGES
              value: {{ join "," . | quote }}
            {{- end }}
            - name: WORKPLACE_AI_AGENT_URL
              value: http://ai-agent:7070
            - name: WORKPLACE_WORKER_URL
              value: http://worker:7080
            # 노트 동기화 서버(WP-288) — 미지정 시 기본값 localhost:6095 라 운영에선 반드시 지정
            - name: WORKPLACE_COLLAB_URL
              value: http://collab:7095
            - name: WORKPLACE_COLLAB_ENABLED
              value: "true"
            # 문서 변환 서비스(WP-430~432 미리보기 PDF) — 미지정 시 기본값 localhost:6085 라 운영에선 반드시 지정
            - name: WORKPLACE_CONVERTER_URL
              value: http://converter:7085
            # 도움말 검색(WP-1509) — 웹이 내는 도움말 묶음을 클러스터 안 web 서비스에서 읽는다(미지정 시 공개 웹 주소)
            - name: WORKPLACE_HELP_BUNDLE_URL
              value: http://web
            # worker 콜백 인증용 내부 서비스 토큰 (= aiAgentToken)
            - name: INTERNAL_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: WORKPLACE_AI_AGENT_TOKEN
            # worker가 ro로 마운트하는 동일 공유 파일 저장 루트 경로
            - name: WORKPLACE_STORAGE_ROOT_DIR
              value: /data/storage-data
            - name: CORS_ALLOWED_ORIGINS
              value: {{ .Values.api.corsAllowedOrigins | quote }}
            # 반복 AI 작업 회차 결과 대기(WP-1407) — ai-agent 반복 상한 + 보고 재시도보다 길게
            - name: WORKPLACE_RECURRENCE_PENDING_TIMEOUT
              value: {{ .Values.api.recurrencePendingTimeout | quote }}
            {{- if .Values.aiAgent.extraCaCerts }}
            # Gen:iA 브라우저 로그인(WP-1461) 서버가 사설 CA 인증서를 쓰므로 ai-agent 와 같은 CA 를 신뢰한다(검증은 끄지 않는다)
            - name: GENIA_LOGIN_CA_CERT_FILE
              value: /etc/ssl/extra-ca/ca.crt
            {{- end }}
          envFrom:
            # POSTGRES_DB/USER/HOST/PORT
            - configMapRef:
                name: smart-workplace-config
            # POSTGRES_PASSWORD, JWT_SECRET, ENCRYPTION_MASTER_KEY, WORKPLACE_AI_AGENT_TOKEN
            - secretRef:
                name: {{ .Values.existingSecret }}
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 9090
            periodSeconds: 10
            failureThreshold: 18   # 최대 ~180s 기동 대기 (compose start_period 120s 대응)
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 9090
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 9090
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          volumeMounts:
            # worker가 ro로 마운트하는 동일 파일 저장 볼륨을 api는 rw로 마운트
            - name: storage
              mountPath: /data/storage-data
            {{- if .Values.aiAgent.extraCaCerts }}
            # 추가 신뢰 CA(ConfigMap ai-agent-extra-ca) — ai-agent 와 같은 것을 읽기 전용으로 마운트
            - name: extra-ca
              mountPath: /etc/ssl/extra-ca
              readOnly: true
            {{- end }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: storage-data
        {{- if .Values.aiAgent.extraCaCerts }}
        - name: extra-ca
          configMap:
            name: ai-agent-extra-ca
        {{- end }}
