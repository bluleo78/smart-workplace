apiVersion: v1
kind: ConfigMap
metadata:
  name: smart-workplace-config
  labels:
    {{- include "swp.labels" . | nindent 4 }}
data:
  POSTGRES_DB: {{ .Values.config.postgresDb | quote }}
  POSTGRES_USER: {{ .Values.config.postgresUser | quote }}
  POSTGRES_HOST: "db"
  POSTGRES_PORT: "5432"
  M365_CLIENT_ID: {{ .Values.config.m365ClientId | quote }}
  M365_TENANT_ID: {{ .Values.config.m365TenantId | quote }}
  M365_REDIRECT_URI: {{ .Values.config.m365RedirectUri | quote }}
  SSO_M365_CLIENT_ID: {{ .Values.config.ssoM365ClientId | quote }}
  SSO_M365_REDIRECT_URI: {{ .Values.config.ssoM365RedirectUri | quote }}
  WEB_BASE_URL: {{ .Values.config.webBaseUrl | quote }}
  {{- with .Values.config.pushSubject }}
  # Web Push VAPID 연락처(sub). Apple 푸시 서비스는 localhost 연락처를 거부하므로 실제 주소 필수
  WORKPLACE_PUSH_SUBJECT: {{ . | quote }}
  {{- end }}
