{{- /*
  노트 동기화 서버 WebSocket 진입점 — 웹과 같은 호스트의 /collab 만 collab 으로 보낸다(웹은 wss://<webHost>/collab 접속).
  WebSocket 장시간 연결용 타임아웃을 이 경로에만 걸려고 웹 Ingress 와 별도 리소스로 둔다.
  /internal/* 은 클러스터 내부(api → collab) 전용이라 절대 경로를 추가하지 않는다.
  TLS Secret 은 웹과 같은 것을 재사용(발급은 certificate.yaml 이 담당 — 여기엔 cert-manager 어노테이션을 두지 않는다).
*/ -}}
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: smart-workplace-collab
  labels:
    {{- include "swp.labels" . | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.webHost | quote }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.webHost | quote }}
      http:
        paths:
          - path: /collab
            pathType: Prefix
            backend:
              service:
                name: collab
                port:
                  number: 7095
{{- end }}
