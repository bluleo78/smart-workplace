# agent-runner 차트 값 — 실행 위치(네임스페이스 하나)마다 한 번 설치한다. 설치 순서는 README.md.

works:
  # Works origin(필수) — 예 https://genia-works.iacloud.kr. runner API 는 그 아래 /api/v1/agent-runtime/runner.
  url: ""

# runner 토큰(rt_…) — 관리자 화면 「AI 실행 위치」에서 발급. 명령줄에 쓰지 말고 --set-file runnerToken=<파일> 로 넘기거나,
# 미리 만든 Secret(키 token)을 existingSecret 으로 가리킨다. 둘 다 없으면 렌더가 실패한다.
runnerToken: ""
existingSecret: ""

image:
  repository: docker.io/iacloudops/genia-works-agent-runner
  # 필수 — 릴리스 버전 태그(예 0.9.38).
  tag: ""
  pullPolicy: IfNotPresent

# 이미지를 받을 pull secret(이 네임스페이스에 미리 만든 것) — runner 와 runner 가 띄우는 AI Pod 모두에 쓴다.
# runner·작업 공간 이미지는 비공개 Docker Hub(iacloudops)에 있어 기본으로 dockerhub-pull 을 쓴다. 공개 레지스트리면 [] 로 둔다.
imagePullSecrets:
  - name: dockerhub-pull

# 템플릿이 시켜도 이 접두어 밖의 이미지는 띄우지 않는다. dind 이미지는 "docker:" 로 허용.
allowedImagePrefixes:
  - docker.io/iacloudops/genia-works-agent-
  - "docker:"

# Works 주소를 내부 IP 로 풀어야 하는 클러스터(공인 주소로 닿지 않는 곳)에서 쓴다 — runner 와 runner 가 띄우는 AI Pod 모두에 들어간다(WP-1269).
# 예: [{ ip: 192.168.100.72, hostnames: [genia-works.iacloud.kr] }]. 비우면 클러스터 DNS 그대로.
hostAliases: []

# 이 위치의 모든 AI Pod 에 똑같이 들어가는 값
agent:
  nodeSelector: {}
  tolerations: []
  # AI Pod 에만 더할 이름 풀이(예: 사내 GitLab) — 위 hostAliases 뒤에 붙는다. runner 자신에게는 들어가지 않는다.
  hostAliases: []
  # AI 작업 디스크(WP-1270). 기본은 노드 로컬 폴더(hostPath) — <hostPath>/agent-<id> 를 쓰고, AI 가 처음 뜬 노드에 고정해
  # 다시 시작해도 같은 폴더를 쓴다. NFS 처럼 느린 StorageClass 를 작업 디스크로 쓰지 않으려는 기본값이다.
  # pvc 로 두면 AI 마다 PVC 를 만든다(storageClass 사용).
  workDisk:
    type: hostPath
    hostPath: /var/lib/genia-agents
  # 작업 디스크 StorageClass — workDisk.type 이 pvc 일 때만 쓴다. 비우면 클러스터 기본.
  storageClass: ""
  # 추가로 믿을 CA 인증서(WP-1276) — 사내 GitLab 처럼 자체서명 인증서를 쓰는 저장소가 있을 때. AI Pod 가 시스템 CA 와 합쳐
  # git·glab·curl·node 가 함께 쓴다. pem(PEM 본문, 여러 개 이어 붙여도 된다)을 주면 차트가 ConfigMap <릴리스>-agent-ca 를 만들고,
  # existingConfigMap 을 주면 이 네임스페이스의 그 ConfigMap(키 ca.crt)을 쓴다. 둘 다 비우면 시스템 CA 만.
  caBundle:
    pem: ""
    existingConfigMap: ""

# 관리자 화면의 「작업 화면 보기」(WP-1277). 보기는 늘 되고, 입력(관리자가 AI 화면에 키를 치기)은 여기서 켜야만 쓸 수 있다.
# 입력은 사실상 AI 작업 공간의 셸이다 — AI 의 비밀값(접속 키·저장소 토큰·모델 연결)을 읽을 수 있고, 특권 dind 의 docker 소켓으로
# 노드에까지 닿을 수 있다. 이 클러스터를 운영하는 쪽이 그 위험을 받아들일 때만 true 로 둔다.
screen:
  allowInput: false

dind:
  # dind 의 /var/lib/docker emptyDir 상한
  storageLimit: 20Gi
  # dind 사이드카 자원(AI Pod 마다) — 아래 quota 가 requests.cpu/memory 를 걸기 때문에 requests 가 꼭 있어야 한다
  # (없으면 모든 AI Pod 가 쿼터 승인에서 거절된다). 기본은 PoC 실측값. 수량은 따옴표로 감싼다.
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "4"
      memory: "6Gi"

terminationGraceSeconds: 60

# 네임스페이스 자원 상한 — AI 가 늘어나 노드를 다 먹지 않게.
# runner 는 AI Pod 의 모든 컨테이너에 requests 를 둔다: agent 는 템플릿 값(없으면 cpu 1·memory 2Gi), dind 는 dind.resources,
# 그 밖의 사이드카는 cpu 100m·memory 128Mi. AI 한 명 기본 템플릿(agent 4/8Gi + dind 500m/1Gi)이면 아래 값으로 3명까지 뜬다.
quota:
  enabled: true
  hard:
    requests.cpu: "16"
    requests.memory: 64Gi
    persistentvolumeclaims: "10"

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 256Mi
