apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "runner.name" . }}
  labels:
    {{- include "runner.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "runner.name" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "runner.name" . }}
    namespace: {{ .Release.Namespace }}
