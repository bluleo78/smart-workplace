# 네임스페이스 범위 Role 만 둔다(ClusterRole 없음) — runner 는 설치한 네임스페이스 밖을 만지지 않는다.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "runner.name" . }}
  labels:
    {{- include "runner.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "persistentvolumeclaims", "secrets", "configmaps"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # 관리자 화면의 「작업 화면 보기」(WP-1277) — AI Pod 에 exec 로 이미지의 agent-screen 을 붙인다(다른 명령은 runner 가 부르지 않는다).
  # exec 는 WebSocket 업그레이드라 create 와 get 이 함께 필요하다.
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get"]
  # 관찰 보고의 CPU·메모리(없어도 runner 는 동작한다)
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get", "list"]
