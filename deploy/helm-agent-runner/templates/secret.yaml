{{- /* runnerToken 값이 있을 때만 토큰 Secret 을 만든다. existingSecret 이 있으면 만들지 않는다. */ -}}
{{- if and .Values.runnerToken (not .Values.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "runner.tokenSecret" . }}
  labels:
    {{- include "runner.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ .Values.runnerToken | quote }}
{{- end }}
